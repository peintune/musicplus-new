name: Build & Release

# ── 触发条件 ──────────────────────────────────────────────
#  推送 v* 标签    → 构建三平台安装包 + 创建 GitHub Release（草稿）
#  向 master 提 PR → 只构建不发布，验证改动能否正常打包（上传产物便于自测）
#  手动触发        → 随时单独出一份构建产物
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 创建 Release 需要写权限；fork PR 的 token 由 GitHub 自动降级为只读，安全
permissions:
  contents: write

# 同一分支/标签重复触发时取消旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 架构守卫：核心层永不引入网络依赖 ──────────────────────
  # 「一次激活、永久离线可用」不是靠自觉，而是靠 CI 强制。
  # mp-core / mp-license 一旦加入 HTTP 客户端，这里会直接拦下。
  # 只做 checkout + 跑脚本，几十秒出结果，失败得快，不浪费打包额度。
  guard:
    name: 架构守卫（核心层零网络）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: 检查 mp-core / mp-license 无网络依赖
        shell: pwsh
        run: ./ci/check-no-net.ps1

  # ── Windows x64（主分发平台，NSIS 安装包）──────────────────
  build-windows:
    name: Windows x64
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 桌面端独立 workspace，缓存要指向 apps/desktop/src-tauri
      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci

      # projectPath 指向含 src-tauri 的目录；tauri-action 会在此执行
      # tauri.conf.json 里的 beforeBuildCommand（npm run build）。
      # 未签名安装包会触发 SmartScreen「Windows 已保护你的电脑」与
      # UAC「发布者: 未知」。购入 OV 代码签名证书后，可在此后追加
      # signtool / Azure Trusted Signing 步骤，并注意签名会改变文件字节。
      - name: 构建 Tauri（Windows）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('MusicPlus {0}', github.ref_name) || '' }}
          releaseBody: |
            下载对应平台的安装包：

            - `*_x64-setup.exe` — Windows 64 位
            - `*.dmg` — macOS（Apple 芯片 / Intel 分别对应 `aarch64` / `x64`）

            一次激活，永久离线可用。
          releaseDraft: true
          prerelease: false
          # 本应用未启用 Tauri 自动更新（无 createUpdaterArtifacts），
          # 关闭 latest.json 生成，避免每次发布出现「签名缺失」警告
          uploadUpdaterJson: false

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v5
        with:
          name: musicplus-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ── macOS ARM（Apple 芯片）────────────────────────────────
  build-macos-arm:
    name: macOS ARM64
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci

      # 纯 Rust + 系统 WebView，无内嵌可执行文件，Tauri 自带的 ad-hoc 签名即可。
      # 注意：未做 Developer ID 签名 + 公证（notarization）时，用户首次打开
      # 需右键「打开」或执行 xattr -rd com.apple.quarantine /Applications/MusicPlus.app。
      - name: 构建 Tauri（macOS ARM）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('MusicPlus {0}', github.ref_name) || '' }}
          releaseBody: |
            下载对应平台的安装包：

            - `*_x64-setup.exe` — Windows 64 位
            - `*.dmg` — macOS（Apple 芯片 / Intel 分别对应 `aarch64` / `x64`）

            一次激活，永久离线可用。
          releaseDraft: true
          prerelease: false
          # 本应用未启用 Tauri 自动更新（无 createUpdaterArtifacts），
          # 关闭 latest.json 生成，避免每次发布出现「签名缺失」警告
          uploadUpdaterJson: false

      - name: 上传 macOS ARM 产物
        uses: actions/upload-artifact@v5
        with:
          name: musicplus-macos-arm64
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── macOS x64（Intel，在 Apple 芯片 runner 上交叉编译）─────
  build-macos-x64:
    name: macOS x64
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装 Rust（含 x86_64 交叉目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci

      # 必须显式指定 target：runner 是 Apple 芯片，不加参数会构建出 arm64 包
      - name: 构建 Tauri（macOS Intel）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target x86_64-apple-darwin
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('MusicPlus {0}', github.ref_name) || '' }}
          releaseBody: |
            下载对应平台的安装包：

            - `*_x64-setup.exe` — Windows 64 位
            - `*.dmg` — macOS（Apple 芯片 / Intel 分别对应 `aarch64` / `x64`）

            一次激活，永久离线可用。
          releaseDraft: true
          prerelease: false
          # 本应用未启用 Tauri 自动更新（无 createUpdaterArtifacts），
          # 关闭 latest.json 生成，避免每次发布出现「签名缺失」警告
          uploadUpdaterJson: false

      - name: 上传 macOS Intel 产物
        uses: actions/upload-artifact@v5
        with:
          name: musicplus-macos-x64
          path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
